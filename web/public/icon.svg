<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2330"/>
      <stop offset="50%" stop-color="#0F131D"/>
      <stop offset="100%" stop-color="#0A0C14"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF375F"/>
      <stop offset="50%" stop-color="#BF5AF2"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Glowing ambient circle -->
  <circle cx="256" cy="256" r="160" fill="url(#roofGrad)" opacity="0.18" filter="url(#glow)"/>

  <!-- Modern House shape -->
  <path d="M 256 128 L 138 232 C 132 237 132 246 138 251 C 143 256 152 256 157 251 L 256 163 L 355 251 C 360 256 369 256 374 251 C 380 246 380 237 374 232 Z" fill="url(#roofGrad)"/>
  <path d="M 166 240 L 166 360 C 166 373 177 384 190 384 L 322 384 C 335 384 346 373 346 360 L 346 240 L 256 160 Z" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4"/>

  <!-- Door / Window Heart -->
  <rect x="226" y="280" width="60" height="104" rx="16" fill="url(#roofGrad)" opacity="0.85"/>

  <!-- Sparkle top-right -->
  <path d="M 370 120 Q 370 145 395 145 Q 370 145 370 170 Q 370 145 345 145 Q 370 145 370 120 Z" fill="url(#accentGrad)" filter="url(#glow)"/>
</svg>
